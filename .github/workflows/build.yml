name: Build CHOLIBI APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Find Project
      run: |
        unzip project.zip -d project_temp
        echo "=== DANH SÁCH THƯ MỤC SAU KHI GIẢI NÉN ==="
        ls -la project_temp
        echo "=== TÌM FILE GRADLEW ==="
        GRADLE_DIR=$(find project_temp -name "gradlew" -exec dirname {} \; | head -n 1)
        echo "Tìm thấy thư mục dự án tại: $GRADLE_DIR"
        if [ -z "$GRADLE_DIR" ]; then
          echo "❌ LỖI: Không tìm thấy file gradlew. File zip có thể bị thiếu."
          exit 1
        fi
        echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

    - name: Build APK
      run: |
        cd $PROJECT_DIR
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CHOLIBI-App
        path: "**/app-debug.apk"
