name: Build CHOLIBI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # The existing project.zip has no Gradle Wrapper.
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare existing project ZIP
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          root = Path('project').resolve()
          with zipfile.ZipFile('project.zip') as archive:
              for entry in archive.infolist():
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe ZIP entry')
              archive.extractall(root)

          # Correct Kotlin-style properties in the archive's Groovy build file.
          build = root / 'app/build.gradle'
          text = build.read_text(encoding='utf-8')
          text = text.replace('isMinifyEnabled = false', 'minifyEnabled = false')
          text = text.replace('isDebuggable = true', 'debuggable = true')
          build.write_text(text, encoding='utf-8')

          # AGP 8 uses the namespace already declared in app/build.gradle.
          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('\n    package="com.cholibi.app"', '')
          manifest.write_text(text, encoding='utf-8')

      - name: Build debug APK
        run: gradle -p project --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and prepare APK
        run: |
          mkdir -p dist
          cp project/app/build/outputs/apk/debug/app-debug.apk dist/CHOLIBI-v31.2-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/CHOLIBI-v31.2-debug.apk
          cd dist
          sha256sum CHOLIBI-v31.2-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHOLIBI-v31.2-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
